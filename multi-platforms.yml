---
- name: Install HTTP server
  hosts: g2
  become: yes
  tasks:
    - name: Install httpd
      yum:
        name: httpd
        state: present
      when: ansible_distribution == "Amazon" or ansible_distribution == "centos"

    - name: start httpd
      service:
        name: httpd
        state: started
      when: ansible_distribution == "Amazon" or ansible_distribution == "centos" 

    - name: enable httpd
      service:
        name: httpd 
        enabled: yes
      when: ansible_distribution == "Amazon" or ansible_distribution == "centos"
    
- name: Install HTTP server
  hosts: g1
  become: yes
  tasks:
    - name: Install Apache
      dnf:
        name: Apache
        state: present
      when: ansible_distribution == "fedora" or ansible_distribution == "ubuntu"

    - name: start Apache
      service:
        name: Apache
        state: started
      when: ansible_distribution == "fedora" or ansible_distribution == "ubuntu"

    - name: enable Apache
      service:
        name: Apache 
        enabled: yes
      when: ansible_distribution == "fedora" or ansible_distribution == "ubuntu"
    
...