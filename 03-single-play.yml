# ansible n3 -m file -a "path=/home/fedora/opt/devops state=directory"
---
- name: Update n1 servers
  hosts: n3
  tasks:
    - name: Create Directory
      file:
        path: /home/ec2-user/opt/devops
        state: directory
      become: yes

    - name: Create info.txt with content
      copy:
        dest: /home/ec2-user/opt/devops/info.txt
        content: "Hello from Ansible!\n"
      become: yes


...

